  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23141211'/%3E%3Crect x='11' y='11' width='42' height='42' rx='13' fill='none' stroke='%23E28E76' stroke-width='2.6'/%3E%3Ctext x='27' y='37' text-anchor='middle' font-family='Georgia, serif' font-size='22' fill='%23E28E76'%3EC%3C/text%3E%3Ctext x='38' y='43' text-anchor='middle' font-family='Georgia, serif' font-size='22' fill='%23E28E76'%3ED%3C/text%3E%3C/svg%3E" />

  <script>
    tailwind.config = {

        extend: {

            serif: ['Playfair Display', 'Georgia', 'serif'],
          }

  <style>
    /* =========================================================================
       VARIABLES THÈME — PALETTE CACAO VELOUTÉ & CRÈME CHAUDE (ÉTAPE 1)
       ========================================================================= */
    :root {
      --bg-outer: #0C0B0A;
      --bg-app: #141211;
      --bg-surface: #1D1A18;
      --bg-surface-alt: #262220;
      --bg-glass: rgba(20, 18, 17, 0.92);
      --bg-input: #1D1A18;
      --border-subtle: #2F2A27;
      --border-strong: #453E3A;
      --text-primary: #F5EFEA;
      --text-secondary: #B5ABA3;
      --text-muted: #827870;
      --accent: #F5EFEA;
      --accent-text: #141211;
      --warm-accent: #E28E76;
      --positive: #86EFAC;
      --negative: #FCA5A5;
      --donut-track: #262220;
    }

    body {
      background-color: var(--bg-outer);
      color: var(--text-primary);
    }

    #app-shell {
      background-color: var(--bg-app);
    }

    /* Grain éditorial ultra-discret en arrière-plan */
    #app-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.03;
      background-image: radial-gradient(var(--text-primary) 0.5px, transparent 0.5px);
      background-size: 18px 18px;
      z-index: 0;
    }

    .ed-surface {
      background-color: var(--bg-surface);
      border-color: var(--border-subtle);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .ed-surface-alt {
      background-color: var(--bg-surface-alt);
      border-color: var(--border-subtle);
    }

    .ed-surface-interactive:hover {
      background-color: var(--bg-surface-alt);
    }

    .ed-glass {
      background-color: var(--bg-glass);
      border-color: var(--border-subtle);
    }

    .ed-input {
      background-color: var(--bg-input);
      border-color: var(--border-subtle);
      color: var(--text-primary);
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .ed-input:focus {
      outline: none;
      border-color: var(--border-strong);
    }

    .ed-input::placeholder {
      color: var(--text-muted);
    }

    .ed-btn-primary {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    .ed-text-primary { color: var(--text-primary); }
    .ed-text-secondary { color: var(--text-secondary); }
    .ed-text-muted { color: var(--text-muted); }
    .ed-warm-accent { color: var(--warm-accent); }
    .ed-border { border-color: var(--border-subtle); }
    .ed-positive { color: var(--positive); }
    .ed-negative { color: var(--negative); }

    /* Barres de défilement masquées */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    @keyframes splashOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(1.02); }
    }
    @keyframes haloPulse {
      0%, 100% { opacity: 0.45; transform: scale(0.96); }
      50% { opacity: 0.78; transform: scale(1.04); }
    }
    .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
    .animate-slide-up { animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-splash-out { animation: splashOut 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    .animate-halo { animation: haloPulse 6s ease-in-out infinite; }

    button, input, select, textarea {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

          <path d="M135,-10 C175,55 215,65 245,120 C275,175 245,235 310,275 L310,-10 Z" fill="url(#organicGrad2)" />

    <!-- Toast discret -->

  <script>
    // =========================================================================
    // 1. CONSTANTES, CATÉGORIES & ÉTAT GLOBAL (LOCALSTORAGE)
    // =========================================================================
    const STORAGE_KEY = 'coffre_doux_state_v1';

    const CATEGORIES = {
      'Courses':      { color: '#6EE7B7', icon: 'cart' },
      'Logement':     { color: '#E28E76', icon: 'home' },
      'Transport':    { color: '#93C5FD', icon: 'car' },
      'Loisirs':      { color: '#C4B5FD', icon: 'sparkle' },
      'Santé':        { color: '#FDA4AF', icon: 'heart' },
      'Épargne':      { color: '#FCD34D', icon: 'shield' },
      'Salaire':      { color: '#6EE7B7', icon: 'wallet' },
      'Autre':        { color: '#9CA3AF', icon: 'tag' }
    };

    const CATEGORY_SVG = {
      cart: '<path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />',
      home: '<path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />',
      car: '<path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />',
      sparkle: '<path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />',
      heart: '<path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />',
      shield: '<path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />',
      wallet: '<path stroke-linecap="round" stroke-linejoin="round" d="M21 12a2.25 2.25 0 00-2.25-2.25H15a3 3 0 11-6 0H5.25A2.25 2.25 0 003 12m18 0v6a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 9m18 0V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v3" />',
      tag: '<path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3z" />'
    };

    function getCurrentMonthISO() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function createCleanData() {
      const month = getCurrentMonthISO();
      return {
        userName: '',
        activeTab: 'home',
        homeLayout: 'passport',
        selectedMonth: month,
        financeFilter: 'all',
        hideBalances: false,
        showWelcomeOnOpen: true,
        soundEffects: true,
        transactions: [],
        goals: []
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createCleanData();
        const parsed = JSON.parse(raw);
        const defaults = createCleanData();
        const rawGoals = Array.isArray(parsed.goals) ? parsed.goals : [];
        const cleanedGoals = rawGoals.filter(g => g.id !== 'goal_demo_1' && g.id !== 'goal_demo_2');
        return {
          ...defaults,
          ...parsed,
          transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
          goals: cleanedGoals
        };
      } catch (e) {
        return createCleanData();
      }
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    // =========================================================================
    // 2. FEEDBACK SONORE DISCRET (WEB AUDIO API — ACCORD FEUTRÉ HARPE / MARIMBA)
    // =========================================================================
    function playSoftChime(type = 'save') {
      if (!state.soundEffects) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        // Notes douces (arpège ascendant apaisant : Do5 -> Mi5 -> Sol5)
        const notes = type === 'save' ? [523.25, 659.25, 783.99] : [440, 392];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const startTime = now + idx * 0.055;
          const duration = 0.34;

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(0.028, startTime + 0.018);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration + 0.02);
        });
      } catch (e) {}
    }

    // =========================================================================
    // 3. ÉCRAN DE BIENVENUE (SPLASH SCREEN)
    // =========================================================================
    function syncWelcomeGreeting() {
      const greetingEl = document.getElementById('welcome-greeting');
      if (!greetingEl) return;
      const cleanName = (state.userName || '').trim();
      greetingEl.textContent = cleanName ? `HELLO ${cleanName.toUpperCase()}` : 'HELLO';
    }

    function showWelcomeScreen() {
      const welcomeEl = document.getElementById('welcome-screen');
      if (!welcomeEl) return;
      syncWelcomeGreeting();
      welcomeEl.classList.remove('hidden', 'animate-splash-out');
    }

    function dismissWelcomeScreen() {
      const welcomeEl = document.getElementById('welcome-screen');
      if (!welcomeEl) return;
      playSoftChime('save');
      welcomeEl.classList.add('animate-splash-out');
      setTimeout(() => {
        welcomeEl.classList.add('hidden');
        welcomeEl.classList.remove('animate-splash-out');
      }, 320);
    }

    // =========================================================================
    // 4. UTILITAIRES DE FORMATAGE & CALCULS FINANCIERS
    // =========================================================================
    function formatCurrency(amount, showSign = false, respectPrivacy = false) {
      if (respectPrivacy && state.hideBalances) {
        return '•••• €';
      }
      const absVal = Math.abs(Number(amount) || 0);
      const formatted = new Intl.NumberFormat('fr-FR', {
        minimumFractionDigits: absVal % 1 === 0 ? 0 : 2,
        maximumFractionDigits: 2
      }).format(absVal);
      if (showSign) {
        return `${amount >= 0 ? '+' : '−'} ${formatted} €`;
      }
      return `${amount < 0 ? '−' : ''}${formatted} €`;
    }

    function formatMonthLabel(monthISO) {
      const [y, m] = monthISO.split('-').map(Number);
      const date = new Date(y, m - 1, 1);
      const label = date.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      return label.charAt(0).toUpperCase() + label.slice(1);
    }

    function shiftMonth(monthISO, delta) {
      const [y, m] = monthISO.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function formatShortDate(dateISO) {
      const [y, m, d] = dateISO.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    }

    function getTransactionsForMonth(monthISO) {
      return state.transactions
        .filter(t => t.date && t.date.startsWith(monthISO))
        .sort((a, b) => b.date.localeCompare(a.date));
    }

    function getCumulativeBalanceUpToMonth(monthISO) {
      return state.transactions
        .filter(t => t.date && t.date.slice(0, 7) <= monthISO)
        .reduce((sum, t) => sum + (t.type === 'income' ? Number(t.amount) : -Number(t.amount)), 0);
    }

    function getCumulativeBalanceBeforeMonth(monthISO) {
      return state.transactions
        .filter(t => t.date && t.date.slice(0, 7) < monthISO)
        .reduce((sum, t) => sum + (t.type === 'income' ? Number(t.amount) : -Number(t.amount)), 0);
    }

    function getGlobalBalance() {
      return state.transactions
        .reduce((sum, t) => sum + (t.type === 'income' ? Number(t.amount) : -Number(t.amount)), 0);
    }

    function getMonthMetrics(monthISO) {
      const txs = getTransactionsForMonth(monthISO);
      let income = 0;
      let expense = 0;
      const byCategory = {};

      txs.forEach(t => {
        const amt = Number(t.amount) || 0;
        if (t.type === 'income') {
          income += amt;
        } else {
          expense += amt;
          byCategory[t.category] = (byCategory[t.category] || 0) + amt;
        }
      });

      const openingBalance = getCumulativeBalanceBeforeMonth(monthISO);
      const balance = openingBalance + income - expense;
      return { txs, income, expense, openingBalance, balance, byCategory };
    }

    function getWeatherInfo(income, expense) {
      if (income === 0 && expense === 0) {
        return {
          status: 'Calme plat',
          badge: 'Météo sereine',
          color: 'var(--text-secondary)',
          message: 'Aucune opération enregistrée ce mois-ci. Prenez le temps de poser vos repères.',
          icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />'
        };
      }
      const ratio = income > 0 ? expense / income : 1.2;
      if (ratio <= 0.7) {
        return {
          status: 'Ciel dégagé',
          badge: 'Météo sereine',
          color: 'var(--positive)',
          message: 'Vos dépenses restent bien inférieures à vos revenus ce mois-ci.',
          icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />'
        };
      }
      if (ratio <= 1.0) {
        return {
          status: 'Éclaircies',
          badge: 'Équilibre fragile',
          color: '#FBBF24',
          message: 'Vos sorties approchent de vos rentrées. Gardez un œil doux sur les prochains jours.',
          icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />'
        };
      }
      return {
        status: 'Averses passagères',
        badge: 'Attention douce',
        color: 'var(--negative)',
        message: 'Vos dépenses dépassent vos revenus sur ce mois. Rien d’irrémédiable, ajustez simplement le rythme.',
        icon: '<path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />'
      };
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // =========================================================================
    // 5. NAVIGATION & CONTRÔLES D'ÉTAT
    // =========================================================================
    function switchTab(tab) {
      state.activeTab = tab;
      saveState();
      updateNavUI();
      renderActiveView();
      const mainEl = document.getElementById('main-content');
      if (mainEl) mainEl.scrollTop = 0;
    }

    function updateNavUI() {
      const titles = {
        home: 'Accueil',
        finance: 'Finance',
        objectives: 'Objectif',
        more: 'Plus'
      };
      const headerTitle = document.getElementById('header-title');
      if (headerTitle) headerTitle.textContent = titles[state.activeTab] || 'Accueil';

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isTarget = btn.id === `nav-${state.activeTab}`;
        btn.style.color = isTarget ? 'var(--text-primary)' : 'var(--text-muted)';
      });
    }

    function toggleHideBalances() {
      state.hideBalances = !state.hideBalances;
      saveState();
      renderActiveView();
    }

    function changeMonth(delta) {
      state.selectedMonth = shiftMonth(state.selectedMonth, delta);
      saveState();
      renderActiveView();
    }

    function setFinanceFilter(filter) {
      state.financeFilter = filter;
      saveState();
      renderActiveView();
    }

    function setHomeLayout(layout) {
      state.homeLayout = layout;
      saveState();
      renderActiveView();
    }

    function getTotalAllocatedToGoals() {
      return (state.goals || []).reduce((sum, g) => sum + Number(g.savedAmount || 0), 0);
    }

    function getGoalCountdownInfo(deadlineISO) {
      if (!deadlineISO) return null;
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      const target = new Date(deadlineISO + 'T00:00:00');
      const diffMs = target - now;
      const days = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
      const months = Math.max(1, Math.round(days / 30.4));
      return { days, months };
    }

    function quickAddGoalFunds(goalId, delta) {
      const goal = state.goals.find(g => g.id === goalId);
      if (!goal) return;
      goal.savedAmount = Math.max(0, Number(goal.savedAmount || 0) + delta);
      saveState();
      playSoftChime('save');
      renderActiveView();
      showToast(delta > 0 ? `+${delta} € mis de côté pour « ${goal.title} »` : `${delta} € retirés de « ${goal.title} »`);
    }

    function setGoalCardTab(goalId, tabName) {
      const goal = state.goals.find(g => g.id === goalId);
      if (!goal) return;
      goal.activeTab = tabName;
      saveState();
      renderActiveView();
    }

    function toggleGoalChecklistItem(goalId, itemId) {
      const goal = state.goals.find(g => g.id === goalId);
      if (!goal || !Array.isArray(goal.checklist)) return;
      const item = goal.checklist.find(c => c.id === itemId);
      if (item) {
        item.done = !item.done;
        saveState();
        playSoftChime('save');
        renderActiveView();
      }
    }

    function addGoalChecklistItem(e, goalId) {
      e.preventDefault();
      const input = e.target.querySelector('input');
      const text = (input.value || '').trim();
      if (!text) return;
      const goal = state.goals.find(g => g.id === goalId);
      if (!goal) return;
      if (!Array.isArray(goal.checklist)) goal.checklist = [];
      goal.checklist.push({ id: 'chk_' + Date.now(), text, done: false });
      saveState();
      renderActiveView();
    }

    function updateGoalNotes(goalId, val) {
      const goal = state.goals.find(g => g.id === goalId);
      if (!goal) return;
      goal.notes = val;
      saveState();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2200);
    }

    // =========================================================================
    // 6. RENDU DES VUES (ACCUEIL / FINANCE / PLUS)
    // =========================================================================
    function renderActiveView() {
      const container = document.getElementById('main-content');
      if (!container) return;
      if (state.activeTab === 'objectives') {
        container.innerHTML = renderObjectivesPassportView();
      } else if (state.activeTab === 'home') {
        container.innerHTML = renderHomeView();
      } else if (state.activeTab === 'finance') {
        container.innerHTML = renderFinanceView();
      } else {
        container.innerHTML = renderMoreView();
      }
    }

    function renderObjectivesPassportView() {
      const goals = state.goals || [];
      const priorityGoal = goals.find(g => g.priority) || goals[0];
      const otherGoals = goals.filter(g => priorityGoal && g.id !== priorityGoal.id);

      const emptyGoalsBlock = `
        <div class="p-6 rounded-3xl ed-surface border ed-border text-center space-y-3">
          <p class="font-serif text-lg ed-text-primary">Aucun projet en vue pour l’instant</p>
          <p class="text-xs ed-text-secondary leading-relaxed">Esquissez votre prochain voyage ou votre prochaine tirelire pour donner vie à vos envies.</p>
          <button onclick="openGoalModal()" class="ed-btn-primary text-xs font-medium px-4 py-2.5 rounded-xl">
            + Esquisser un projet
          </button>
        </div>
      `;

      let heroHTML = '';
      if (priorityGoal) {
        const pct = Math.min(100, Math.round((priorityGoal.savedAmount / (priorityGoal.targetAmount || 1)) * 100));
        const remaining = Math.max(0, priorityGoal.targetAmount - priorityGoal.savedAmount);
        const countdown = getGoalCountdownInfo(priorityGoal.deadline);
        const perMonth = (countdown && remaining > 0) ? Math.ceil(remaining / countdown.months) : 0;

        heroHTML = `
          <section class="relative overflow-hidden p-5 rounded-3xl ed-surface border ed-border space-y-4">
            <!-- Onde organique feutrée signature -->
            <div class="pointer-events-none absolute -top-8 -right-8 w-52 h-52 opacity-45">
              <svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                <defs>
                  <linearGradient id="cardWaveGoal" x1="20" y1="0" x2="220" y2="210" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#F2B8A2" stop-opacity="0.32" />
                    <stop offset="60%" stop-color="#D97B66" stop-opacity="0.16" />
                    <stop offset="100%" stop-color="#8B4A58" stop-opacity="0" />
                  </linearGradient>
                </defs>
                <path d="M60,-15 C105,35 145,28 182,68 C220,108 205,172 250,200 L250,-15 Z" fill="url(#cardWaveGoal)" />
                <path d="M105,-10 C138,42 170,50 194,95 C218,140 192,190 245,220 L245,-10 Z" fill="url(#cardWaveGoal)" opacity="0.65" />
              </svg>
            </div>
            <div style="background: radial-gradient(circle, rgba(226,142,118,0.16) 0%, transparent 70%);" class="pointer-events-none absolute -top-12 -right-12 w-44 h-44 rounded-full animate-halo"></div>

            <div class="relative z-10 flex items-start justify-between gap-2">
              <div>
                <span class="inline-block text-[10px] uppercase tracking-[0.2em] ed-warm-accent font-semibold mb-1">
                  CAP PRIORITAIRE · ${escapeHTML(priorityGoal.category || 'Voyage')}
                </span>
                <h2 class="font-serif text-2xl font-medium ed-text-primary leading-snug">
                  ${escapeHTML(priorityGoal.title)}
                </h2>
              </div>
              <button onclick="openGoalModal('${priorityGoal.id}')" class="text-[11px] ed-text-muted hover:ed-text-primary px-2 py-1 rounded-lg ed-surface-alt border ed-border">
                Ajuster
              </button>
            </div>

            ${countdown ? `
              <div class="relative z-10 flex flex-wrap items-center gap-2 text-[11px] ed-text-secondary">
                <span class="px-2.5 py-1 rounded-full ed-surface-alt border ed-border">
                  ${countdown.days > 0 ? `Départ dans <strong class="ed-text-primary font-medium">${countdown.days} jours</strong>` : 'Le grand jour est là'}
                </span>
                ${perMonth > 0 ? `
                  <span class="px-2.5 py-1 rounded-full ed-surface-alt border ed-border">
                    Rythme doux : <strong class="ed-warm-accent font-medium">${formatCurrency(perMonth, false, true)}/mois</strong>
                  </span>
                ` : ''}
              </div>
            ` : ''}

            <div class="relative z-10 space-y-2">
              <div class="flex items-baseline justify-between">
                <span class="font-serif text-xl font-medium ed-text-primary">${formatCurrency(priorityGoal.savedAmount, false, true)}</span>
                <span class="text-xs ed-text-muted">sur ${formatCurrency(priorityGoal.targetAmount, false, true)} (${pct}%)</span>
              </div>
              <div class="w-full h-2 rounded-full overflow-hidden" style="background-color: var(--bg-surface-alt);">
                <div style="width: ${pct}%; background-color: var(--warm-accent);" class="h-full rounded-full transition-all duration-500"></div>
              </div>
            </div>

            <div class="relative z-10 grid grid-cols-3 gap-2 pt-1">
              <button onclick="quickAddGoalFunds('${priorityGoal.id}', 20)" class="py-2 rounded-xl ed-surface-alt border ed-border text-xs font-medium ed-positive hover:border-[#6EE7B7]/50 active:scale-95 transition-all">
                + 20 €
              </button>
              <button onclick="quickAddGoalFunds('${priorityGoal.id}', 50)" class="py-2 rounded-xl ed-surface-alt border ed-border text-xs font-medium ed-positive hover:border-[#6EE7B7]/50 active:scale-95 transition-all">
                + 50 €
              </button>
              <button onclick="quickAddGoalFunds('${priorityGoal.id}', 100)" class="py-2 rounded-xl ed-surface-alt border ed-border text-xs font-medium ed-positive hover:border-[#6EE7B7]/50 active:scale-95 transition-all">
                + 100 €
              </button>
            </div>
          </section>
        `;
      }

      return `
        <div class="space-y-5 animate-fade-in">
          ${goals.length === 0 ? emptyGoalsBlock : `
            ${heroHTML}

            <section class="space-y-3">
              <div class="flex items-center justify-between">
                <p class="text-[11px] uppercase tracking-[0.2em] ed-text-secondary font-medium">Vos tirelires</p>
                <button onclick="openGoalModal()" class="text-xs ed-warm-accent font-medium hover:opacity-80">
                  + Nouvelle tirelire
                </button>
              </div>

              ${otherGoals.length === 0 ? `
                <p class="text-xs ed-text-muted">Ajoutez une autre escapade ou une réserve douce pour faire grandir plusieurs envies à votre rythme.</p>
              ` : `
                <div class="space-y-2.5">
                  ${otherGoals.map(g => {
                    const pct = Math.min(100, Math.round((g.savedAmount / (g.targetAmount || 1)) * 100));
                    return `
                      <div class="p-4 rounded-2xl ed-surface border ed-border space-y-2.5">
                        <div class="flex items-center justify-between">
                          <div onclick="openGoalModal('${g.id}')" class="cursor-pointer">
                            <p class="text-sm font-medium ed-text-primary">${escapeHTML(g.title)}</p>
                            <p class="text-[11px] ed-text-muted">${formatCurrency(g.savedAmount, false, true)} / ${formatCurrency(g.targetAmount, false, true)}</p>

                          <button onclick="quickAddGoalFunds('${g.id}', 50)" class="px-3 py-1.5 rounded-xl ed-surface-alt border ed-border text-xs font-medium ed-positive hover:border-[#6EE7B7]/50 active:scale-95 transition-all">

                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </section>
          `}
        </div>
      `;
    }

    function renderHomeView() {
      const layout = state.homeLayout || 'roadbook';
      const globalBalance = getGlobalBalance();
      const totalAllocated = getTotalAllocatedToGoals();
      const freeReserve = globalBalance - totalAllocated;
      const goals = state.goals || [];
      const cleanName = (state.userName || '').trim();
      const todayLabel = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      const formattedToday = todayLabel.charAt(0).toUpperCase() + todayLabel.slice(1);

      const layoutSwitcher = `
        <div class="p-1 rounded-2xl ed-surface border ed-border grid grid-cols-2 gap-1">
          ${[
            { id: 'roadbook', label: 'Carnet' },
            { id: 'horizon', label: 'Horizon' }
          ].map(opt => `
            <button
              onclick="setHomeLayout('${opt.id}')"
              class="py-2 px-2 rounded-xl text-[11px] font-medium transition-all ${layout === opt.id ? 'ed-btn-primary shadow-xs' : 'ed-text-secondary hover:ed-text-primary'}"
            >
              ${opt.label}
            </button>
          `).join('')}
        </div>
      `;

      const emptyGoalsBlock = `
        <div class="p-6 rounded-3xl ed-surface border ed-border text-center space-y-3">
          <p class="font-serif text-lg ed-text-primary">Aucun projet en vue pour l’instant</p>
          <p class="text-xs ed-text-secondary leading-relaxed">Esquissez votre prochain voyage ou votre prochaine tirelire pour donner vie à vos envies.</p>
          <button onclick="openGoalModal()" class="ed-btn-primary text-xs font-medium px-4 py-2.5 rounded-xl">
            + Esquisser un projet
          </button>
        </div>
      `;

      // =======================================================================
      // LE CARNET DE ROUTE (BUDGET + CHECK-LIST + NOTES)
      // =======================================================================
      if (layout === 'roadbook') {
        return `
          <div class="space-y-5 animate-fade-in">
            ${layoutSwitcher}

            <section class="p-4 rounded-2xl ed-surface border ed-border flex items-center justify-between">
              <div>
                <p class="text-[10px] uppercase tracking-[0.2em] ed-text-muted font-medium">Souffle libre (hors projets)</p>
                <p class="font-serif text-xl font-medium ${freeReserve < 0 ? 'ed-negative' : 'ed-text-primary'} mt-0.5">

              </button>
            </section>

              <div class="space-y-4">
                ${goals.map(g => {
                  const tab = g.activeTab || 'budget';
                  const pct = Math.min(100, Math.round((g.savedAmount / (g.targetAmount || 1)) * 100));
                  const checklist = Array.isArray(g.checklist) ? g.checklist : [];
                  const doneCount = checklist.filter(c => c.done).length;

                  return `
                    <article class="p-4 rounded-3xl ed-surface border ed-border space-y-3.5">
                      <div class="flex items-start justify-between">
                        <div>
                          <span class="text-[10px] uppercase tracking-[0.2em] ed-warm-accent font-semibold">${escapeHTML(g.category || 'Voyage')}</span>
                          <h3 class="font-serif text-xl font-medium ed-text-primary">${escapeHTML(g.title)}</h3>
                        </div>
                        <button onclick="openGoalModal('${g.id}')" class="text-[11px] ed-text-muted hover:ed-text-primary">Ajuster</button>
                      </div>

                      <!-- Mini onglets du Carnet -->
                      <div class="flex gap-1.5 border-b ed-border pb-2.5">
                        ${[
                          { id: 'budget', label: `Tirelire (${pct}%)` },
                          { id: 'checklist', label: `Préparatifs (${doneCount}/${checklist.length})` },
                          { id: 'notes', label: 'Carnet' }
                        ].map(t => `
                          <button
                            onclick="setGoalCardTab('${g.id}', '${t.id}')"
                            class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-colors ${tab === t.id ? 'ed-btn-primary' : 'ed-surface-alt ed-text-secondary'}"
                          >
                            ${t.label}
                          </button>
                        `).join('')}
                      </div>

                      ${tab === 'budget' ? `
                        <div class="space-y-2.5">
                          <div class="flex justify-between text-xs">
                            <span class="ed-text-primary font-medium">${formatCurrency(g.savedAmount, false, true)}</span>
                            <span class="ed-text-muted">Cap : ${formatCurrency(g.targetAmount, false, true)}</span>
                          </div>
                          <div class="w-full h-2 rounded-full overflow-hidden" style="background-color: var(--bg-surface-alt);">
                            <div style="width: ${pct}%; background-color: var(--warm-accent);" class="h-full rounded-full"></div>
                          </div>
                          <div class="flex gap-2 pt-1">
                            <button onclick="quickAddGoalFunds('${g.id}', -20)" class="px-3 py-1.5 rounded-xl ed-surface-alt border ed-border text-xs ed-negative">− 20 €</button>
                            <button onclick="quickAddGoalFunds('${g.id}', 50)" class="flex-1 py-1.5 rounded-xl ed-surface-alt border ed-border text-xs font-medium ed-positive">+ Glisser 50 €</button>
                          </div>
                        </div>
                      ` : ''}

                      ${tab === 'checklist' ? `
                        <div class="space-y-2">
                          ${checklist.map(item => `
                            <div onclick="toggleGoalChecklistItem('${g.id}', '${item.id}')" class="flex items-center gap-2.5 p-2 rounded-xl ed-surface-alt cursor-pointer">
                              <span class="w-4 h-4 rounded-md border ed-border flex items-center justify-center text-[10px] ${item.done ? 'ed-btn-primary' : ''}">
                                ${item.done ? '✓' : ''}
                              </span>
                              <span class="text-xs ${item.done ? 'line-through ed-text-muted' : 'ed-text-primary'}">${escapeHTML(item.text)}</span>
                            </div>
                          `).join('')}
                          <form onsubmit="addGoalChecklistItem(event, '${g.id}')" class="flex gap-1.5 pt-1">
                            <input type="text" placeholder="Noter un petit préparatif..." class="flex-1 text-xs px-3 py-2 rounded-xl ed-input border" />

    function buildBalanceSparklineSVG(txs, openingBalance = 0, closingBalance = 0) {
      if (state.hideBalances) {
        return `
          <svg viewBox="0 0 300 50" class="w-full h-full overflow-visible">
            <line x1="0" y1="25" x2="300" y2="25" stroke="var(--border-strong)" stroke-width="1.5" stroke-dasharray="4 4" />
          </svg>
        `;
      }

      if (!txs || txs.length === 0) {
        return `
          <svg viewBox="0 0 300 50" class="w-full h-full overflow-visible">
            <line x1="0" y1="28" x2="300" y2="28" stroke="var(--warm-accent)" stroke-width="1.6" stroke-opacity="0.55" />
            <circle cx="300" cy="28" r="3" fill="var(--warm-accent)" />
          </svg>
        `;
      }

      const chronological = [...txs].sort((a, b) => a.date.localeCompare(b.date));
      let running = openingBalance;
      const points = [openingBalance];
      chronological.forEach(t => {
        running += t.type === 'income' ? Number(t.amount) : -Number(t.amount);
        points.push(running);
      });

      const minVal = Math.min(...points);
      const maxVal = Math.max(...points);
      const span = maxVal - minVal || 1;
      const width = 300;
      const height = 46;
      const padY = 6;

      const coords = points.map((val, idx) => {
        const x = (idx / (points.length - 1)) * width;
        const y = height - padY - ((val - minVal) / span) * (height - padY * 2);
        return [x, y];
      });

      const pathD = coords.map((pt, idx) => `${idx === 0 ? 'M' : 'L'} ${pt[0].toFixed(1)} ${pt[1].toFixed(1)}`).join(' ');
      const areaD = `${pathD} L ${width} ${height} L 0 ${height} Z`;
      const lastPt = coords[coords.length - 1];

      return `
        <svg viewBox="0 0 300 46" class="w-full h-full overflow-visible">
          <defs>
            <linearGradient id="horizonFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#E28E76" stop-opacity="0.25" />
              <stop offset="100%" stop-color="#E28E76" stop-opacity="0" />
            </linearGradient>
          </defs>
          <path d="${areaD}" fill="url(#horizonFill)" />
          <path d="${pathD}" fill="none" stroke="var(--warm-accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="3.2" fill="var(--warm-accent)" />
        </svg>
      `;
    }

      if (state.activeTab === 'finance' && state.selectedMonth && !todayISO.startsWith(state.selectedMonth)) {

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-serif text-xl font-medium ed-text-primary">
              ${existing ? 'Ajuster le mouvement' : 'Nouveau mouvement'}
            </h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full ed-surface border ed-border flex items-center justify-center ed-text-secondary hover:ed-text-primary text-xs">✕</button>
          </div>

          <form onsubmit="submitTransaction(event, '${editId || ''}')" class="space-y-3.5">
            <input type="hidden" name="type" id="tx-type-input" value="${type}" />

            <!-- Boutons épurés − et + teintés -->
            <div class="grid grid-cols-2 gap-2.5">
              <button
                type="button"
                id="btn-type-expense"
                onclick="selectTxType('expense')"
                style="background-color: rgba(252, 165, 165, ${type === 'expense' ? '0.18' : '0.06'}); border-color: ${type === 'expense' ? 'var(--negative)' : 'rgba(252, 165, 165, 0.25)'};"
                class="py-3 rounded-2xl border flex items-center justify-center transition-all"
              >
                <span class="text-xl font-medium ed-negative leading-none">−</span>
              </button>
              <button
                type="button"
                id="btn-type-income"
                onclick="selectTxType('income')"
                style="background-color: rgba(110, 231, 183, ${type === 'income' ? '0.18' : '0.06'}); border-color: ${type === 'income' ? 'var(--positive)' : 'rgba(110, 231, 183, 0.25)'};"
                class="py-3 rounded-2xl border flex items-center justify-center transition-all"
              >
                <span class="text-xl font-medium ed-positive leading-none">+</span>
              </button>
            </div>

            <div>
              <label class="text-[11px] ed-text-secondary block mb-1">Montant (€)</label>
              <input
                type="number"
                step="0.01"
                min="0.01"
                name="amount"
                value="${amount}"
                required
                placeholder="0,00"
                class="w-full text-lg font-serif px-3.5 py-2.5 rounded-xl ed-input border"
              />
            </div>

            <div>
              <label class="text-[11px] ed-text-secondary block mb-1">Libellé</label>
              <input
                type="text"
                name="label"
                value="${escapeHTML(label)}"
                required
                placeholder="Ex: Marché, Salaire, Loyer..."
                class="w-full text-sm px-3.5 py-2.5 rounded-xl ed-input border"
              />
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="text-[11px] ed-text-secondary block mb-1">Catégorie</label>
                <select name="category" id="tx-category-select" class="w-full text-sm px-3.5 py-2.5 rounded-xl ed-input border">
                  ${Object.keys(CATEGORIES).map(cat => `
                    <option value="${cat}" ${category === cat ? 'selected' : ''}>${cat}</option>
                  `).join('')}
                </select>
              </div>
              <div>
                <label class="text-[11px] ed-text-secondary block mb-1">Date</label>
                <input
                  type="date"
                  name="date"
                  value="${date}"
                  required
                  class="w-full text-sm px-3.5 py-2.5 rounded-xl ed-input border"
                />
              </div>
            </div>

            <div class="flex gap-2.5 pt-2">
              ${existing ? `
                <button
                  type="button"
                  onclick="deleteTransaction('${existing.id}'); closeModal();"
                  class="px-4 py-3 rounded-xl border ed-border ed-surface ed-negative text-xs font-medium"
                >
                  Supprimer
                </button>
              ` : ''}
              <button type="submit" class="flex-1 ed-btn-primary text-sm font-medium py-3 rounded-xl active:scale-[0.99] transition-transform">
                ${existing ? 'Mettre à jour' : 'Enregistrer'}
              </button>
            </div>
          </form>
        </div>
      `);
    }

    function selectTxType(newType) {
      const hidden = document.getElementById('tx-type-input');
      const btnExp = document.getElementById('btn-type-expense');
      const btnInc = document.getElementById('btn-type-income');
      const catSel = document.getElementById('tx-category-select');
      if (hidden) hidden.value = newType;
      if (btnExp) {
        btnExp.style.backgroundColor = newType === 'expense' ? 'rgba(252, 165, 165, 0.18)' : 'rgba(252, 165, 165, 0.06)';
        btnExp.style.borderColor = newType === 'expense' ? 'var(--negative)' : 'rgba(252, 165, 165, 0.25)';
      }
      if (btnInc) {
        btnInc.style.backgroundColor = newType === 'income' ? 'rgba(110, 231, 183, 0.18)' : 'rgba(110, 231, 183, 0.06)';
        btnInc.style.borderColor = newType === 'income' ? 'var(--positive)' : 'rgba(110, 231, 183, 0.25)';
      }
      if (catSel) {
        catSel.value = newType === 'income' ? 'Salaire' : 'Courses';
      }
    }

    function submitTransaction(e, editId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const txDate = fd.get('date');
      const txObj = {
        id: editId || ('tx_' + Date.now()),
        type: fd.get('type'),
        amount: parseFloat(fd.get('amount')),
        label: fd.get('label').trim(),
        category: fd.get('category'),
        date: txDate
      };

      if (editId) {
        const idx = state.transactions.findIndex(t => t.id === editId);
        if (idx !== -1) state.transactions[idx] = txObj;
      } else {
        state.transactions.unshift(txObj);
      }

      if (txDate && txDate.length >= 7) {
        state.selectedMonth = txDate.slice(0, 7);
      }

      saveState();
      playSoftChime('save');
      closeModal();
      renderActiveView();
      showToast(editId ? 'Opération modifiée' : 'Opération ajoutée');
    }

    function deleteTransaction(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      saveState();
      renderActiveView();
      showToast('Opération supprimée');
    }

    // =========================================================================
    // 8B. MODALE DE CRÉATION / ÉDITION D'UN PROJET OU VOYAGE
    // =========================================================================
    function openGoalModal(editId = null) {
      const existing = editId ? state.goals.find(g => g.id === editId) : null;
      const title = existing ? existing.title : '';
      const category = existing ? (existing.category || 'Voyage') : 'Voyage';
      const targetAmount = existing ? existing.targetAmount : '';
      const savedAmount = existing ? existing.savedAmount : 0;
      const deadline = existing ? (existing.deadline || '') : '';
      const priority = existing ? Boolean(existing.priority) : (state.goals.length === 0);

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-serif text-xl font-medium ed-text-primary">
              ${existing ? 'Ajuster le projet' : 'Nouveau projet ou escapade'}
            </h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full ed-surface border ed-border flex items-center justify-center ed-text-secondary hover:ed-text-primary text-xs">✕</button>
          </div>

          <form onsubmit="submitGoal(event, '${editId || ''}')" class="space-y-3.5">
            <div>
              <label class="text-[11px] ed-text-secondary block mb-1">Nom du projet ou de la destination</label>
              <input
                type="text"
                name="title"
                value="${escapeHTML(title)}"
                required
                placeholder="Ex: Escapade à Kyoto, Fonds de sécurité..."
                class="w-full text-sm px-3.5 py-2.5 rounded-xl ed-input border"
              />
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="text-[11px] ed-text-secondary block mb-1">Objectif (€)</label>
                <input
                  type="number"
                  step="1"
                  min="1"
                  name="targetAmount"
                  value="${targetAmount}"
                  required
                  placeholder="2000"
                  class="w-full text-sm px-3.5 py-2.5 rounded-xl ed-input border"
                />
              </div>
              <div>
                <label class="text-[11px] ed-text-secondary block mb-1">Déjà mis de côté (€)</label>
                <input
                  type="number"
                  step="1"
                  min="0"
                  name="savedAmount"
                  value="${savedAmount}"
                  required
                  class="w-full text-sm px-3.5 py-2.5 rounded-xl ed-input border"
                />
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="text-[11px] ed-text-secondary block mb-1">Thème</label>
                <select name="category" class="w-full text-sm px-3.5 py-2.5 rounded-xl ed-input border">
                  ${['Voyage', 'Évasion', 'Sécurité', 'Projet', 'Cadeau'].map(cat => `
                    <option value="${cat}" ${category === cat ? 'selected' : ''}>${cat}</option>
                  `).join('')}
                </select>
              </div>
              <div>
                <label class="text-[11px] ed-text-secondary block mb-1">Échéance (optionnel)</label>
                <input
                  type="date"
                  name="deadline"
                  value="${deadline}"
                  class="w-full text-sm px-3.5 py-2.5 rounded-xl ed-input border"
                />
              </div>
            </div>

            <label class="flex items-center gap-2.5 pt-1 cursor-pointer">
              <input type="checkbox" name="priority" ${priority ? 'checked' : ''} class="rounded" />
              <span class="text-xs ed-text-secondary">Définir comme cap prioritaire (mis en avant)</span>
            </label>

            <div class="flex gap-2.5 pt-2">
              ${existing ? `
                <button
                  type="button"
                  onclick="deleteGoal('${existing.id}'); closeModal();"
                  class="px-4 py-3 rounded-xl border ed-border ed-surface ed-negative text-xs font-medium"
                >
                  Supprimer
                </button>
              ` : ''}
              <button type="submit" class="flex-1 ed-btn-primary text-sm font-medium py-3 rounded-xl active:scale-[0.99] transition-transform">
                ${existing ? 'Mettre à jour' : 'Créer le projet'}
              </button>
            </div>
          </form>
        </div>
      `);
    }

    function submitGoal(e, editId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const isPriority = fd.get('priority') === 'on';

      if (isPriority) {
        state.goals.forEach(g => { g.priority = false; });
      }

      if (editId) {
        const idx = state.goals.findIndex(g => g.id === editId);
        if (idx !== -1) {
          state.goals[idx] = {
            ...state.goals[idx],
            title: fd.get('title').trim(),
            category: fd.get('category'),
            targetAmount: parseFloat(fd.get('targetAmount')),
            savedAmount: parseFloat(fd.get('savedAmount')) || 0,
            deadline: fd.get('deadline') || '',
            priority: isPriority
          };
        }
      } else {
        state.goals.unshift({
          id: 'goal_' + Date.now(),
          title: fd.get('title').trim(),
          category: fd.get('category'),
          targetAmount: parseFloat(fd.get('targetAmount')),
          savedAmount: parseFloat(fd.get('savedAmount')) || 0,
          deadline: fd.get('deadline') || '',
          priority: isPriority,
          activeTab: 'budget',
          notes: '',
          checklist: []
        });
      }

      saveState();
      playSoftChime('save');
      closeModal();
      renderActiveView();
      showToast(editId ? 'Projet mis à jour' : 'Nouveau projet créé');
    }

    function deleteGoal(id) {
      state.goals = state.goals.filter(g => g.id !== id);
      saveState();
      renderActiveView();
      showToast('Projet supprimé');
    }

    // =========================================================================
    // 9. EXPORT / IMPORT JSON
    // =========================================================================
    function exportJSON() {
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `coffre-doux-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Sauvegarde exportée');
    }

    function importJSON(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          state = {
            ...createCleanData(),
            ...imported,
            transactions: Array.isArray(imported.transactions) ? imported.transactions : [],
            goals: Array.isArray(imported.goals) ? imported.goals : []
          };
          if (state.transactions.length > 0 && state.transactions[0].date) {
            state.selectedMonth = state.transactions[0].date.slice(0, 7);
          }
          saveState();
          updateNavUI();
          renderActiveView();
          showToast('Données importées');
        } catch (err) {
          showToast('Fichier JSON invalide');
        }
      };
      reader.readAsText(file);
    }

    // =========================================================================
    // 10. INITIALISATION DE L'APPLICATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      updateNavUI();
      renderActiveView();
      if (state.showWelcomeOnOpen) {
        showWelcomeScreen();
      }
    });
  </script>
</body>
</html>
