<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Coffre-Doux</title>
  <meta name="theme-color" content="#141211" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231D1A18'/%3E%3Crect x='6' y='6' width='52' height='52' rx='14' fill='none' stroke='%23E28E76' stroke-opacity='0.45' stroke-width='1.5'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Georgia, serif' font-style='italic' font-size='26' fill='%23E28E76'%3ECD%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-app: #141211;
      --bg-card: #1D1A18;
      --bg-card-soft: #24201D;
      --bg-input: #171413;
      --text-main: #F5EFEA;
      --text-muted: #A69B92;
      --text-subtle: #786E66;
      --accent: #E28E76;
      --accent-soft: rgba(226, 142, 118, 0.14);
      --accent-glow: rgba(226, 142, 118, 0.24);
      --positive: #7FB696;
      --positive-bg: rgba(127, 182, 150, 0.11);
      --negative: #E08279;
      --negative-bg: rgba(224, 130, 121, 0.11);
      --border: rgba(245, 239, 234, 0.08);
      --border-strong: rgba(245, 239, 234, 0.16);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .font-serif-ed {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .label-caps {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    @keyframes haloBreath {
      0%, 100% { transform: scale(0.96); opacity: 0.55; }
      50% { transform: scale(1.06); opacity: 0.85; }
    }

    .halo-pulse {
      animation: haloBreath 6.5s ease-in-out infinite;
    }

    .app-shell {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-app);
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      background: rgba(20, 18, 17, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .brand-logo-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      color: var(--accent);
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .brand-logo-btn:active {
      transform: scale(0.95);
    }

    .header-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin: 0;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.18s ease, border-color 0.18s ease;
    }

    .icon-btn:hover {
      color: var(--text-main);
      border-color: var(--border-strong);
    }

    #main-content {
      flex: 1;
      padding: 20px 20px 104px;
    }

    .ed-card {
      position: relative;
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
    }

    .ed-card-soft {
      position: relative;
      overflow: hidden;
      background: var(--bg-card-soft);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
    }

    .organic-wave {
      position: absolute;
      right: -24px;
      top: -24px;
      width: 170px;
      height: 170px;
      pointer-events: none;
      opacity: 0.55;
    }

    .btn-cream {
      background: var(--text-main);
      color: var(--bg-app);
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn-cream:active {
      transform: scale(0.97);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 11px 16px;
      font-weight: 500;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .sign-btn {
      flex: 1;
      height: 54px;
      border-radius: 16px;
      font-size: 1.5rem;
      font-weight: 400;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .sign-btn:active {
      transform: scale(0.97);
    }

    .sign-minus {
      background: var(--negative-bg);
      color: var(--negative);
      border: 1px solid rgba(224, 130, 121, 0.25);
    }

    .sign-minus.selected {
      border-color: var(--negative);
      box-shadow: 0 0 0 1px var(--negative);
    }

    .sign-plus {
      background: var(--positive-bg);
      color: var(--positive);
      border: 1px solid rgba(127, 182, 150, 0.25);
    }

    .sign-plus.selected {
      border-color: var(--positive);
      box-shadow: 0 0 0 1px var(--positive);
    }

    .progress-track {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: rgba(245, 239, 234, 0.08);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #F2B39F);
      transition: width 0.35s ease;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      z-index: 25;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(20, 18, 17, 0.94);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 10px 12px 14px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-subtle);
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      padding: 6px;
      border-radius: 12px;
      transition: color 0.18s ease, background 0.18s ease;
    }

    .nav-item.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .welcome-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 24px 36px;
      overflow-y: auto;
    }

    .welcome-screen.hidden {
      display: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(10, 9, 8, 0.76);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--bg-card);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      border: 1px solid var(--border-strong);
      padding: 24px 20px 32px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 11px 13px;
      font-family: inherit;
      font-size: 0.92rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .pill-tab {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
    }

    .pill-tab.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(226, 142, 118, 0.35);
    }
  </style>
</head>
<body>
  <div id="welcome-screen" class="welcome-screen">
    <svg style="position:fixed;top:-30px;right:-30px;width:240px;height:240px;pointer-events:none;opacity:0.45;" viewBox="0 0 240 240" fill="none">
      <path d="M45 10C110 -5 215 25 235 110C250 175 180 225 115 205C55 188 15 115 45 10Z" fill="url(#welcomeWaveGrad)" />
      <defs>
        <linearGradient id="welcomeWaveGrad" x1="40" y1="10" x2="220" y2="200" gradientUnits="userSpaceOnUse">
          <stop stop-color="#E28E76" stop-opacity="0.45" />
          <stop offset="1" stop-color="#E28E76" stop-opacity="0.03" />
        </linearGradient>
      </defs>
    </svg>

    <div style="display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;">
      <div style="width:42px;height:42px;border-radius:13px;background:var(--bg-card);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--accent);font-family:'Playfair Display',serif;font-style:italic;font-size:1.25rem;">
        CD
      </div>
      <span class="label-caps" id="welcome-date-label"></span>
    </div>

    <div style="position:relative;z-index:2;max-width:440px;margin:48px 0;">
      <p class="label-caps" style="color:var(--accent);margin-bottom:12px;" id="welcome-greeting-small">BONJOUR</p>
      <h1 class="font-serif-ed" style="font-size:2.35rem;line-height:1.15;font-weight:500;margin:0 0 18px;">
        Bienvenue sur votre <span style="font-style:italic;color:var(--accent);">Coffre Doux.</span>
      </h1>
      <p style="color:var(--text-muted);line-height:1.65;font-size:0.98rem;margin:0;">
        Un espace calme et chaleureux pour suivre votre argent au fil des mois et faire grandir vos envies tout en douceur.
      </p>
    </div>

    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;">
      <button type="button" class="btn-cream" style="width:100%;padding:15px 20px;font-size:0.95rem;" onclick="enterApp()">
        CONTINUER →
      </button>
    </div>
  </div>

  <div class="app-shell">
    <header class="top-header">
      <button type="button" class="brand-logo-btn" title="Retour à l'accueil" onclick="navigateTo('home')" aria-label="Accueil">
        <span style="font-family
